<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Biblioteca</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container glass-effect">
        <div class="login-header">
            <h1>📚 Biblioteca API</h1>
            <p>Faça login para continuar</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" placeholder="admin ou aluno" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="admin123 ou aluno123" required autocomplete="off">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Entrar</button>
            <div id="loginError" class="error-msg" style="display: none;"></div>
        </form>
        <div class="login-hints">
            <p><strong>Admin:</strong> admin / admin123</p>
            <p><strong>Aluno:</strong> aluno / aluno123</p>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            
            const errorDiv = document.getElementById('loginError');
            errorDiv.style.display = 'none';

            if (auth.login(user, pass)) {
                if (auth.getProfile() === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'usuario.html';
                }
            } else {
                errorDiv.textContent = 'Usuário ou senha incorretos.';
                errorDiv.style.display = 'block';
                // Adiciona animação de erro
                const container = document.querySelector('.login-container');
                container.classList.add('shake');
                setTimeout(() => container.classList.remove('shake'), 500);
            }
        });
    </script>
</body>
</html>
